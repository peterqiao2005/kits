services:
  kuma:
    image: louislam/uptime-kuma:2
    container_name: portal-console-kuma
    volumes:
      - portal_console_kuma_data:/app/data
    ports:
      - "3001:3001"

  backend:
    depends_on:
      kuma:
        condition: service_started
    environment:
      KUMA_URL: http://kuma:3001
      KUMA_TOKEN: ""

volumes:
  portal_console_kuma_data:
